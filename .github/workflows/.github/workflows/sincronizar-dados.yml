name: Sincronizar Dados CAP

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 minutos
  workflow_dispatch: {}       # permite rodar manualmente pela aba Actions do GitHub

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install msal requests

      - name: Sincronizar usuarios.json
        env:
          CAP_CLIENT_SECRET: ${{ secrets.CAP_CLIENT_SECRET }}
        run: python scripts/sincronizar_usuarios.py

      - name: Sincronizar lancamentos.json
        env:
          CAP_CLIENT_SECRET: ${{ secrets.CAP_CLIENT_SECRET }}
        run: python scripts/sincronizar_lancamentos.py

      - name: Commit e push se houver mudança
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add usuarios.json lancamentos.json
          git diff --staged --quiet || git commit -m "Sincroniza usuarios.json e lancamentos.json"
          git push
